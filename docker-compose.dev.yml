services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./data:/data/sync
      - uploads:/data/uploads
      - ./frontend/facture:/data/invoices
  web:
    volumes:
      - ./templates/campus-shop.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
