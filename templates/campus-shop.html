<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #101828;
      --mute: #5B6478;
      --line: #E3E7F1;
      --bg: #F6F7FB;
      --blue: #2438F0;
      --tint: #E8ECFF;
      --ok: #0E7A4B;
      --okbg: #DDF5E8;
      --warn: #8A4B00;
      --warnbg: #FFEBCB;
      --red: #B42318;
      --redbg: #FEE4E2
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 Figtree, system-ui, sans-serif
    }

    h1,
    h2,
    .big,
    .logo,
    .kpi b {
      font-family: 'Bricolage Grotesque', Figtree, sans-serif;
      letter-spacing: -.02em
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid #FFB020;
      outline-offset: 2px
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 24px;
      padding: 12px clamp(16px, 4vw, 48px);
      background: #fff;
      border-bottom: 1px solid var(--line)
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      color: var(--blue)
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--mute);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap
    }

    .live-status::before {
      content: '';
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #0E7A4B
    }

    .live-status.reconnecting::before { background: #D98B00 }
    .live-status.offline::before { background: #B42318 }

    #version-banner {
      display: none;
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      align-items: center;
      gap: 12px;
      max-width: calc(100vw - 24px);
      padding: 10px 12px 10px 16px;
      border: 1px solid #C9D0F5;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(16, 24, 40, .14);
      font-weight: 700
    }

    #version-banner.on { display: flex }

    .top nav {
      display: flex;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
      min-width: 100%;
      order: 3
    }

    @media(min-width:760px) {
      .top nav {
        min-width: 0;
        order: 0
      }
    }

    .top nav button {
      padding: 10px 14px;
      border-radius: 999px;
      border: 0;
      background: none;
      color: var(--mute);
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer
    }

    .top nav button[aria-current] {
      background: var(--tint);
      color: var(--blue)
    }

    .btn {
      min-height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      border: 0;
      background: var(--ink);
      color: #fff;
      font-weight: 700;
      cursor: pointer
    }

    .btn.alt {
      background: #fff;
      color: var(--ink);
      border: 1.5px solid var(--ink)
    }

    .btn.sm {
      min-height: 36px;
      padding: 0 14px;
      font-size: 14px
    }

    .btn.del {
      background: #fff;
      color: var(--red);
      border: 1.5px solid #F0B8B2
    }

    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px clamp(16px, 4vw, 48px) 48px;
      display: grid;
      gap: 28px
    }

    .hero {
      background: var(--blue);
      color: #fff;
      border-radius: 28px;
      padding: clamp(22px, 4vw, 44px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
      align-items: end
    }

    .hero h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600
    }

    .hero p {
      margin: 0
    }

    .big {
      font-size: clamp(38px, 7vw, 76px);
      font-weight: 800;
      line-height: 1;
      margin: 10px 0 6px
    }

    .ctl {
      display: grid;
      gap: 12px
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .ctl label {
      flex: 1 1 140px;
      display: grid;
      gap: 4px;
      font-weight: 600;
      font-size: 13px
    }

    .ctl input {
      min-height: 44px;
      border-radius: 12px;
      border: 0;
      padding: 0 12px;
      background: #fff;
      color: var(--ink)
    }

    .seg {
      display: flex;
      background: rgba(255, 255, 255, .18);
      border-radius: 999px;
      padding: 4px
    }

    .seg button {
      flex: 1;
      min-height: 40px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #fff;
      font-weight: 700;
      cursor: pointer
    }

    .seg button[aria-pressed=true] {
      background: #fff;
      color: var(--blue)
    }

    .kpis {
      display: flex;
      flex-wrap: wrap;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px
    }

    .kpi {
      flex: 1 1 200px;
      padding: 20px 24px;
      border-right: 1px solid var(--line)
    }

    .kpi:last-child {
      border-right: 0
    }

    .kpi span {
      display: block;
      color: var(--mute);
      font-weight: 600
    }

    .kpi b {
      display: block;
      font-size: 26px;
      margin-top: 4px
    }

    .cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 28px
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: clamp(16px, 3vw, 28px)
    }

    .panel h2 {
      margin: 0 0 4px;
      font-size: 20px
    }

    .sub {
      color: var(--mute);
      margin: 0 0 16px
    }

    .bars {
      display: grid;
      gap: 8px
    }

    .bar {
      display: grid;
      grid-template-columns: 84px 1fr 104px;
      gap: 10px;
      align-items: center
    }

    .bar i {
      display: block;
      height: 14px;
      border-radius: 7px;
      background: var(--blue);
      min-width: 3px
    }

    .bar em {
      font-style: normal;
      color: var(--mute);
      font-weight: 600
    }

    .bar b {
      text-align: right
    }

    svg {
      width: 100%;
      height: auto;
      display: block
    }

    .tw {
      overflow-x: auto
    }

    table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      text-align: left
    }

    th {
      color: var(--mute);
      font-weight: 600;
      padding: 10px 8px;
      border-bottom: 2px solid var(--ink)
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap
    }

    .yes {
      background: var(--okbg);
      color: var(--ok)
    }

    .no {
      background: #ECEEF4;
      color: #3B4458
    }

    .wait {
      background: var(--warnbg);
      color: var(--warn)
    }

    .late {
      background: var(--redbg);
      color: var(--red)
    }

    .th {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--tint);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 800 20px 'Bricolage Grotesque';
      color: var(--blue);
      flex: none
    }

    .th.lg {
      width: 96px;
      height: 96px;
      font-size: 36px
    }

    form.f {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      margin-bottom: 18px;
      padding: 16px;
      background: var(--tint);
      border-radius: 16px
    }

    form.f label {
      flex: 1 1 150px;
      display: grid;
      gap: 4px;
      font-weight: 600;
      font-size: 13px
    }

    form.f input,
    form.f select,
    td input {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid #C9D0F5;
      padding: 0 12px;
      background: #fff;
      width: 100%
    }

    form.f input[type=file] {
      padding: 9px 12px
    }

    td input {
      min-height: 36px;
      max-width: 130px
    }

    .hint {
      flex-basis: 100%;
      margin: 0;
      color: var(--mute);
      font-size: 13px
    }

    .fx {
      flex: 2 1 320px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .fx label {
      flex: 1 1 140px
    }

    .fx[hidden] {
      display: none
    }

    .kyc {
      flex-basis: 100%;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px;
      border: 2px dashed #9AA6F5;
      border-radius: 14px;
      background: #fff
    }

    .kyc[hidden] {
      display: none
    }

    .kyc>b {
      flex-basis: 100%
    }

    .sg {
      flex-basis: 100%
    }

    .sg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px
    }

    .sg-title {
      display: grid;
      gap: 2px
    }

    .sg-title span {
      color: var(--mute);
      font-size: 13px;
      font-weight: 500
    }

    .sg-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .sg canvas {
      width: 100%;
      height: 150px;
      background: #fff;
      border: 2px dashed #9AA6F5;
      border-radius: 12px;
      touch-action: none;
      display: block;
      cursor: crosshair
    }

    .sg canvas:focus-visible {
      border-color: var(--blue)
    }

    .sg-status {
      min-height: 20px;
      margin: 6px 0 0;
      color: var(--mute);
      font-size: 13px
    }

    .sg.signature-fullscreen,
    .sg:fullscreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(18px, 5vw, 72px);
      background: #F6F7FB
    }

    .sg.signature-fullscreen canvas,
    .sg:fullscreen canvas {
      height: min(55vh, 420px);
      border-color: var(--blue);
      box-shadow: 0 12px 36px rgba(16, 24, 40, .12)
    }

    .sg.signature-fullscreen .sg-status,
    .sg:fullscreen .sg-status {
      font-size: 14px
    }

    form.f .chk {
      flex-basis: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600
    }

    form.f .chk input {
      width: 22px;
      min-height: 22px
    }

    .send {
      display: grid;
      gap: 10px;
      background: #F6F7FB;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px
    }

    .send label {
      display: grid;
      gap: 4px;
      font-weight: 600;
      font-size: 13px
    }

    .send input {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid #C9D0F5;
      padding: 0 12px;
      width: 100%;
      background: #fff
    }

    .send .hint {
      margin: 0;
      color: var(--mute);
      font-size: 13px
    }

    form.f [hidden] {
      display: none
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      max-width: 90vw;
      z-index: 20
    }

    #toast.on {
      opacity: 1
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 0 16px 36px
    }

    #inv {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 40, .6);
      z-index: 15;
      overflow: auto;
      padding: 16px;
      display: none
    }

    #inv.on {
      display: block
    }

    .paper {
      background: #fff;
      color: #111;
      max-width: 760px;
      margin: 0 auto;
      border-radius: 12px;
      padding: clamp(18px, 4vw, 40px)
    }

    .paper h2 {
      margin: 0;
      font-size: 30px;
      color: var(--blue)
    }

    .paper .hd {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px
    }

    .paper table {
      min-width: 0;
      margin: 14px 0
    }

    .paper .tot {
      margin-left: auto;
      max-width: 300px
    }

    .paper .tot div {
      display: flex;
      justify-content: space-between;
      padding: 4px 0
    }

    .paper .bt {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .paper .signature-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 52px;
      min-height: 112px;
      page-break-inside: avoid
    }

    .paper .signature {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 96px
    }

    .paper .signature-line {
      border-bottom: 1px solid #111;
      height: 42px
    }

    .paper .invoice-footer {
      border-top: 1px solid var(--line);
      margin-top: 34px;
      padding-top: 16px;
      text-align: center;
      color: #5B6478;
      font-size: 13px;
      page-break-inside: avoid
    }

    @media (max-width: 640px) {
      .top {
        gap: 8px 12px;
        padding: 10px 16px;
      }

      .top > .btn {
        flex: 1;
        min-width: 0;
        padding: 0 12px;
      }

      .top nav {
        margin: 0 -4px;
        padding-bottom: 2px;
      }

      main {
        gap: 18px;
        padding: 18px 12px 32px;
      }

      .hero {
        gap: 20px;
        border-radius: 20px;
        padding: 20px;
        grid-template-columns: minmax(0, 1fr);
      }

      .big {
        font-size: clamp(34px, 12vw, 52px);
        overflow-wrap: anywhere;
      }

      .ctl .row,
      .ctl label {
        min-width: 0;
      }

      .ctl label {
        flex-basis: 100%;
      }

      .seg {
        width: 100%;
      }

      .kpis {
        border-radius: 16px;
      }

      .kpi {
        flex-basis: 50%;
        min-width: 0;
        padding: 14px 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .kpi:nth-last-child(-n + 2) {
        border-bottom: 0;
      }

      .kpi b {
        font-size: 21px;
        overflow-wrap: anywhere;
      }

      .panel {
        border-radius: 16px;
        padding: 16px;
      }

      .bar {
        grid-template-columns: 62px minmax(0, 1fr) auto;
        gap: 6px;
        font-size: 13px;
      }

      .bar b {
        font-size: 12px;
      }

      form.f {
        padding: 12px;
      }

      form.f > .btn,
      .send .row .btn {
        width: 100%;
      }

      .fx,
      .fx label,
      form.f label {
        min-width: 0;
      }

      .sg-actions {
        width: 100%;
      }

      .sg-actions .btn {
        flex: 1;
      }

      .paper {
        padding: 18px;
        border-radius: 8px;
      }

      .paper h2 {
        font-size: 24px;
      }

      .paper .hd > div:last-child {
        width: 100%;
        text-align: left !important;
      }

      .paper .signature-area {
        grid-template-columns: 1fr;
        gap: 24px;
        margin-top: 32px;
      }

      .paper .bt,
      .paper .send .row {
        justify-content: stretch;
      }

      .paper .bt .btn,
      .paper .send .row .btn {
        flex: 1 1 100%;
      }
    }

    .paper.pdf-rendering .noprint {
      display: none !important
    }

    @media print {
      body>*:not(#inv) {
        display: none !important
      }

      #inv {
        position: static;
        background: #fff;
        padding: 0;
        display: block
      }

      .paper {
        max-width: none;
        border-radius: 0;
        padding: 0
      }

      .noprint {
        display: none !important
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="logo">Campus Shop</div>
    <div class="live-status" id="live-status" role="status" aria-live="polite">En direct</div>
    <nav aria-label="Navigation principale" id="nav">
      <button type="button" data-go="dashboard">Tableau de bord</button><button type="button"
        data-go="produits">Produits</button><button type="button" data-go="ventes">Ventes</button><button type="button"
        data-go="dettes">Facilités et dettes</button>
    </nav>
    <button class="btn" type="button" data-go="ventes">Nouvelle vente</button>
  </header>
  <main id="main"></main>
  <footer>
    <button class="btn alt sm" data-act="csv" type="button">Exporter les ventes (CSV)</button>
    <button class="btn del sm" data-act="reset" type="button">Réinitialiser les données d'exemple</button>
  </footer>
  <div id="inv" role="dialog" aria-modal="true" aria-label="Facture"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="version-banner" role="status" aria-live="polite">Nouvelle version disponible <button class="btn sm" type="button" id="reload-version">Recharger</button></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/@simplewebauthn/browser@14.0.1/dist/bundle/index.umd.min.js"
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const K = 'campusshop-v2', $ = id => document.getElementById(id);
    const API_BASE = window.CAMPUS_SHOP_API_BASE || '';
    const apiUrl = path => API_BASE + path;
    const fmt = n => Math.round(n).toLocaleString('fr-FR') + ' Ar';
    const e = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const day = s => new Date(s + 'T00:00:00');
    const addDays = (s, n) => { const d = day(s); d.setDate(d.getDate() + n); return iso(d) };
    const ago = n => addDays(iso(new Date()), -n);
    const short = s => day(s).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
    const long = s => day(s).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    const wk = s => { const d = day(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d) };
    const gain = s => s.q * (s.v - s.a), tot = s => s.q * s.v, pd = s => s.pays.reduce((t, x) => t + x.m, 0), reste = s => tot(s) - pd(s);
    const sched = s => { if (!s.plan) return []; const R = tot(s) - s.ac, t = s.plan.t, u = Math.floor(R / t); return [...Array(t)].map((_, k) => ({ d: addDays(s.d, s.plan.iv * (k + 1)), m: k == t - 1 ? R - u * (t - 1) : u })) };
    const due = s => { let c = s.ac; sched(s).forEach(x => { if (x.d <= ago(0)) c += x.m }); return c };
    const late = s => reste(s) > 0 && pd(s) < due(s);
    const nextDue = s => { let c = s.ac; for (const x of sched(s)) { c += x.m; if (c > pd(s)) return { d: x.d, m: c - pd(s) } } return null };
    const thumb = (p, c = '') => p && p.img ? `<img class="th ${c}" src="${p.img}" alt="">` : `<div class="th ${c}" aria-hidden="true">${p ? e(p.n[0] || '?').toUpperCase() : '?'}</div>`;
    const prod = id => db.P.find(p => p.id == id);

    function seed() {
      const P = [{ id: 1, n: 'Clé USB 32 Go', a: 18000, v: 25000, s: 60, f: 1, t: 2, iv: 14, img: '' }, { id: 2, n: 'Powerbank 10 000 mAh', a: 45000, v: 60000, s: 30, f: 1, t: 3, iv: 14, img: '' }, { id: 3, n: 'Cahier 200 pages', a: 2000, v: 3000, s: 200, f: 0, t: 0, iv: 0, img: '' }, { id: 4, n: 'Écouteurs filaires', a: 6000, v: 10000, s: 40, f: 0, t: 0, iv: 0, img: '' }];
      const C = ['Aina', 'Hery', 'Lalaina', 'Fanja', 'Tiana', 'Mamy'], S = []; let id = 1;
      for (let i = 29; i >= 0; i--)for (let k = 0; k < 1 + (i % 3 == 0 ? 1 : 0); k++) {
        const p = P[(i * 3 + k) % 4], q = 1 + ((i + k) % 4), t = q * p.v, d = ago(i), plan = p.f && (i + k) % 3 == 0;

  <div class="row"><button class="btn" data-act="savepdf" data-id="${s.id}" type="button">Enregistrer le PDF</button><button class="btn alt" data-act="swa" data-id="${s.id}" type="button">Partager le PDF</button><button class="btn alt" data-act="sem" data-id="${s.id}" type="button">Envoyer par email</button></div>
  <p class="hint">Nom : ${String(s.no).padStart(4, '0')}-${e(s.c)}-${e(s.n)}.pdf. Les ventes récentes apparaissent en premier.</p></div>
  <div class="hd"><div><h2>Campus Shop</h2><div>Vente de produits sur le campus</div></div><div style="text-align:right"><b>FACTURE N° ${String(s.no).padStart(4, '0')}</b><br>${long(s.d)}<br>Client : <b>${e(s.c)}</b>${s.etu ? '<br>N° ETU ' + s.etu : ''}${s.tel ? '<br>' + e(s.tel) : ''}</div></div>
  <table><thead><tr><th>Article</th><th>Qté</th><th>Prix unitaire</th><th style="text-align:right">Total</th></tr></thead><tbody><tr><td><div class="row">${thumb(p)}<b>${e(s.n)}</b></div></td><td>${s.q}</td><td>${fmt(s.v)}</td><td style="text-align:right">${fmt(tot(s))}</td></tr></tbody></table>
  <div class="tot"><div><span>Total à payer</span><b>${fmt(tot(s))}</b></div><div><span>Déjà payé</span><span>${fmt(pd(s))}</span></div><div style="border-top:2px solid #111;font-size:18px"><b>Reste à payer</b><b>${fmt(reste(s))}</b></div></div>
  <p><b>Paiements reçus</b></p><table><tbody>${s.pays.map(x => `<tr><td>${long(x.d)}</td><td style="text-align:right">${fmt(x.m)}</td></tr>`).join('') || '<tr><td>Aucun paiement</td></tr>'}</tbody></table>
  ${sc.length ? `<p><b>Échéancier de la facilité de paiement</b> (acompte ${fmt(s.ac)})</p><table><tbody>${sc.map((x, i) => `<tr><td>Tranche ${i + 1}</td><td>${long(x.d)}</td><td style="text-align:right">${fmt(x.m)}</td></tr>`).join('')}</tbody></table>` : ''}
  <div class="signature-area"><div class="signature"><b>Signature du vendeur</b><div class="signature-line"></div></div><div class="signature"><b>Signature du client</b><div class="signature-line"></div></div></div>
  <div class="invoice-footer"><b>Merci pour votre confiance.</b><br>En cas de problème, appelez le <b>033 49 641 80</b>.</div></div>`;
      $('inv').classList.add('on');
    }

    /* ---------- Reconnaissance de dette et signature ---------- */
    let sigOn = false, tmpC = '';
    const wa = s => { const d = s.tel.replace(/\D/g, ''), n = d.startsWith('261') ? d : '261' + d.replace(/^0/, ''); return 'https://wa.me/' + n + '?text=' + encodeURIComponent('Bonjour ' + s.c + ', rappel : il vous reste ' + fmt(reste(s)) + ' à payer pour ' + s.n + '. Merci !') };
    const safeFilename = value => String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'sans-nom';
    const invoiceFilename = sale => 'Campus-facture-' + String(sale.no).padStart(4, '0') + '-' + safeFilename(sale.c) + '-' + safeFilename(sale.n) + '.pdf';
    async function buildInvoicePdf(id) {
      if (!window.html2pdf) throw new Error('PDF indisponible');
      const paper = document.querySelector('.paper');
      if (!paper) throw new Error('Facture fermée');
      paper.classList.add('pdf-rendering');
      try {
        const sale = db.S.find(x => x.id === id), filename = invoiceFilename(sale);
        const blob = await html2pdf().set({ margin: 0, filename, image: { type: 'jpeg', quality: .98 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(paper).outputPdf('blob');
        return new File([blob], filename, { type: 'application/pdf' });
      } finally { paper.classList.remove('pdf-rendering') }
    }
    function downloadInvoiceToDevice(file) {
      const url = URL.createObjectURL(file), link = document.createElement('a');
      link.href = url; link.download = file.name; link.rel = 'noopener';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    async function saveInvoicePdf(id) {
      try {
        const file = await buildInvoicePdf(id);
        downloadInvoiceToDevice(file);
        try {
          await saveFileOnServer(file);
          toast('PDF téléchargé sur cet appareil et copié sur le serveur : ' + file.name);
        } catch (error) {
          toast('PDF téléchargé sur cet appareil : ' + file.name);
        }
      } catch (error) {
        toast('Téléchargement du PDF impossible');
      }
    }
    async function saveFileOnServer(file) {
      const upload = new FormData(); upload.append('file', file, file.name);
      const response = await fetch(apiUrl('/api/factures'), { method: 'POST', body: upload });
      if (!response.ok) throw new Error('Sauvegarde serveur refusée');
    }
    async function shareInvoicePdf(id) {
      if (!navigator.share) return toast('Le partage de fichier n’est pas disponible sur cet appareil');
      try {
        const file = await buildInvoicePdf(id);
        await saveFileOnServer(file);
        if (!navigator.canShare || !navigator.canShare({ files: [file] })) return toast('Le partage de fichier PDF n’est pas pris en charge par ce navigateur');
        await navigator.share({ title: 'Facture', files: [file] });
      } catch (error) { if (error.name !== 'AbortError') toast('Impossible de préparer le PDF'); }
    }
    async function sendWhatsAppInvoice(id) {
      const sale = db.S.find(x => x.id === id), destination = ($('sn').value || '').replace(/\D/g, '');
      if (destination.length < 9) return toast('Numéro WhatsApp invalide');
      const number = destination.startsWith('261') ? destination : '261' + destination.replace(/^0/, '');
      const whatsappUrl = 'https://wa.me/' + number;
      try {
        const file = await buildInvoicePdf(id);
        await saveFileOnServer(file);
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ title: 'Facture', files: [file] });
          return;
        }
        window.open(whatsappUrl, '_blank', 'noopener');
        toast('PDF enregistré dans frontend/facture : joins-le dans WhatsApp');
      } catch (error) { toast('Impossible de préparer le PDF'); }
    }
    async function emailInvoice(id, email, message) {
      try {
        const file = await buildInvoicePdf(id);
        await saveFileOnServer(file);
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ title: 'Facture', text: message, files: [file] });
          return;
        }
        toast('PDF enregistré dans frontend/facture : ajoute-le à ton email');
        setTimeout(() => { location.href = 'mailto:' + email + '?subject=' + encodeURIComponent('Facture n° ' + String(db.S.find(x => x.id === id).no).padStart(4, '0') + ' — Campus Shop') + '&body=' + encodeURIComponent(message) }, 500);
      } catch (error) { toast('Impossible de préparer le PDF'); }
    }
    const msgFac = s => { const n = nextDue(s); return 'Bonjour ' + s.c + ',\nvoici votre facture n° ' + String(s.no).padStart(4, '0') + ' du ' + long(s.d) + ' :\n' + s.n + ' ×' + s.q + '\nTotal : ' + fmt(tot(s)) + '\nDéjà payé : ' + fmt(pd(s)) + '\nReste à payer : ' + fmt(reste(s)) + (reste(s) > 0 && n ? '\nProchaine échéance : ' + long(n.d) + ' (' + fmt(n.m) + ')' : '') + '\nMerci pour votre confiance. — Campus Shop' };
    function setSigFullscreen(active) {
      const pad = $('signature-pad'), button = document.querySelector('[data-act="sigfull"]'); if (!pad) return;
      pad.classList.toggle('signature-fullscreen', active); if (button) { button.setAttribute('aria-pressed', String(active)); button.textContent = active ? 'Quitter le plein écran' : 'Plein écran' }
    }
    async function toggleSigFullscreen() {
      const pad = $('signature-pad'); if (!pad) return;
      if (document.fullscreenElement === pad) return document.exitFullscreen();
      if (pad.requestFullscreen) { try { await pad.requestFullscreen() } catch (error) { setSigFullscreen(true) } } else setSigFullscreen(true)
    }
    function sigInit() {
      const c = $('sig'); if (!c) return; const x = c.getContext('2d'); x.lineWidth = 3; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#101828'; let d = false;
      const pt = v => { const r = c.getBoundingClientRect(); return [(v.clientX - r.left) * c.width / r.width, (v.clientY - r.top) * c.height / r.height] };
      c.onpointerdown = v => { d = true; c.setPointerCapture(v.pointerId); const [a, b] = pt(v); x.beginPath(); x.moveTo(a, b) };
      c.onpointermove = v => { if (!d) return; const [a, b] = pt(v); x.lineTo(a, b); x.stroke(); sigOn = true; $('sig-status').textContent = 'Signature en cours. Vous pouvez l’effacer et recommencer.' };
      c.onpointerup = c.onpointercancel = () => { d = false }
    }
    function debtDoc(id) {
      const s = db.S.find(x => x.id === id), sc = sched(s), r = tot(s) - s.ac;
      $('inv').innerHTML = `<div class="paper"><div class="bt noprint"><button class="btn" data-act="print" type="button">Imprimer / PDF</button><button class="btn alt" data-act="inv" data-id="${s.id}" type="button">Voir la facture</button><button class="btn alt" data-act="close" type="button">Fermer</button></div>
  <div class="hd"><div><h2>Reconnaissance de dette</h2><div>Campus Shop · facture n° ${String(s.no).padStart(4, '0')}</div></div>${thumb({ img: s.cph, n: s.c }, 'lg')}</div>
  <p>Je soussigné(e) <b>${e(s.c)}</b>, étudiant(e) portant le numéro ETU <b>${e(s.etu)}</b>${s.tel ? ', joignable au ' + e(s.tel) + (s.wa ? ' (WhatsApp)' : ' (sans WhatsApp)') : ''}, reconnais devoir à <b>Campus Shop</b> la somme de <b>${fmt(r)}</b>, solde de mon achat de <b>${e(s.n)} ×${s.q}</b> d'un montant total de ${fmt(tot(s))}, effectué le ${long(s.d)}. J'ai versé un acompte de ${fmt(s.ac)}.</p>
  <p>Je m'engage à payer ce solde en ${s.plan.t} tranche(s), selon l'échéancier suivant :</p>
  <table><tbody>${sc.map((x, i) => `<tr><td>Tranche ${i + 1}</td><td>${long(x.d)}</td><td style="text-align:right">${fmt(x.m)}</td></tr>`).join('')}</tbody></table>
  <p>Fait le ${long(s.d)}.</p>
  <div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:12px"><div>Signature du client<br><img src="${s.sig}" alt="Signature du client" style="width:240px;max-width:100%;border-bottom:1px solid #111"></div><div>Signature du vendeur<br><div style="height:90px;width:220px;border-bottom:1px solid #111"></div></div></div></div>`;
      $('inv').classList.add('on');
    }

    /* ---------- Navigation et événements ---------- */
    const V = { dashboard: vDash, produits: vProd, ventes: vVentes, dettes: vDettes };
    function go(p) {
      if (p) page = p; document.querySelectorAll('#nav button').forEach(b => b.toggleAttribute('aria-current', b.dataset.go === page));
      V[page](); window.scrollTo(0, 0);
    }
    document.addEventListener('click', ev => {
      const g = ev.target.closest('[data-go]'); if (g) return go(g.dataset.go);
      const b = ev.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, id = +b.dataset.id;
      if (a === 'mode') { st.m = b.dataset.m; upd() }
      if (a === 'delp' && confirm('Supprimer ce produit ?')) { db.P = db.P.filter(p => p.id !== id); save(); vProd(); toast('Produit supprimé') }
      if (a === 'pay') {
        const s = db.S.find(x => x.id === id), v = Math.min(+b.closest('tr').querySelector('input').value || 0, reste(s));
        if (v > 0) { s.pays.push({ d: ago(0), m: v }); save(); vDettes(); toast('Versement de ' + fmt(v) + ' enregistré') }
      }
      if (a === 'savepdf') { saveInvoicePdf(id) }
      if (a === 'swa' || a === 'sem' || a === 'ssh') {
        const s = db.S.find(x => x.id === id), m = msgFac(s);
        if (a === 'swa') { sendWhatsAppInvoice(id) }
        if (a === 'sem') { const em = ($('se').value || '').trim(); if (!/^\S+@\S+\.\S+$/.test(em)) return toast('Adresse email invalide'); emailInvoice(id, em, m) }
        if (a === 'ssh') navigator.share({ title: 'Facture Campus Shop', text: m }).catch(() => { })
      }
      if (a === 'inv') invoice(id);
      if (a === 'debt') debtDoc(id);
      if (a === 'sigfull') toggleSigFullscreen();
      if (a === 'clrsig') { const c = $('sig'); c.getContext('2d').clearRect(0, 0, c.width, c.height); sigOn = false; $('sig-status').textContent = 'Zone effacée. Tracez la signature du client.'; c.focus() }
      if (a === 'close') $('inv').classList.remove('on');
      if (a === 'print') window.print();
      if (a === 'reset' && confirm("Remplacer toutes les données par les exemples ?")) { db = seed(); save(); go(); toast('Données réinitialisées') }
      if (a === 'csv') {
        const r = ['numero;date;client;produit;quantite;total;gain;paye'].concat(db.S.map(s => [s.no, s.d, s.c, s.n, s.q, tot(s), gain(s), pd(s)].join(';')));
        const u = URL.createObjectURL(new Blob(['\ufeff' + r.join('\n')], { type: 'text/csv' })), l = document.createElement('a'); l.href = u; l.download = 'ventes.csv'; l.click(); URL.revokeObjectURL(u)
      }
    });
    document.addEventListener('fullscreenchange', () => setSigFullscreen(document.fullscreenElement === $('signature-pad')));
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('signature-pad')?.classList.contains('signature-fullscreen')) setSigFullscreen(false) });
    document.addEventListener('change', ev => {
      if (ev.target.id === 'ff') $('fx').hidden = ev.target.value !== '1';
      if (ev.target.id === 'env') { const v = ev.target.value, w = v === 'wa', d = $('dest'); $('dl').hidden = v === '0'; $('dl').firstChild.textContent = w ? 'Numéro WhatsApp du destinataire' : 'Email du destinataire'; d.type = w ? 'tel' : 'email'; d.inputMode = w ? 'tel' : 'email'; d.placeholder = w ? '034 00 000 00' : 'nom@exemple.com'; d.value = '' }
      if (ev.target.id === 'ph' && ev.target.files[0]) readImg(ev.target.files[0], u => { tmpImg = u; $('pv').innerHTML = `<img class="th lg" src="${u}" alt="Aperçu">` });
      if (ev.target.id === 'sm') ev.target.dataset.auto = 0;
      if (ev.target.id === 'cph' && ev.target.files[0]) readImg(ev.target.files[0], u => { tmpC = u; $('cpv').innerHTML = `<img class="th lg" src="${u}" alt="Aperçu">` });
    });
    document.addEventListener('submit', async ev => {
      ev.preventDefault(); const f = new FormData(ev.target);
      if (ev.target.id === 'fp') { const fa = +f.get('f'); db.P.unshift({ id: Date.now(), n: f.get('n').trim(), a: +f.get('a'), v: +f.get('v'), s: +f.get('s'), f: fa, t: fa ? +f.get('t') : 0, iv: fa ? +f.get('iv') : 0, img: tmpImg }); save(); vProd(); toast('Produit créé') }
      if (ev.target.id === 'fv') {
        const p = prod(f.get('p')), q = +f.get('q');
        if (!p || q < 1 || q > p.s) return toast('Stock insuffisant : ' + (p ? p.s : 0) + ' disponible(s)');
        const fac = p.f && f.get('mode') === '1', t = q * p.v, ac = fac ? Math.min(Math.max(+f.get('m'), 0), t) : t, kyc = fac && ac < t, etu = kyc ? (f.get('etu') || '').trim() : '';
        if (kyc) {
          if (!/^\d{4}$/.test(etu)) return toast('Numéro ETU : 4 chiffres exactement');
          if ((f.get('tel') || '').replace(/\D/g, '').length < 9) return toast('Numéro de téléphone invalide');
          if (!tmpC) return toast('Ajoute la photo du client'); if (!sigOn) return toast('Le client doit signer');
          if (f.get('approval') === 'biometric') {
            if (!biometricApproved) { try { await biometricApproval() } catch (error) { return toast(error.message || 'Empreinte biométrique refusée') } }
          } else if (!$('ack').checked) return toast('Coche la reconnaissance de dette')
        }
        const env = f.get('env') || '0'; let dest = (f.get('dest') || '').trim();
        if (env !== '0') {
          if (!dest && kyc) dest = env === 'wa' ? (f.get('tel') || '').trim() : (f.get('email') || '').trim();
          if (env === 'wa' && dest.replace(/\D/g, '').length < 9) return toast("Numéro WhatsApp invalide pour l'envoi");
          if (env === 'em' && !/^\S+@\S+\.\S+$/.test(dest)) return toast("Adresse email invalide pour l'envoi")
        }
        const s = { id: Date.now(), no: db.n++, d: ago(0), pid: p.id, n: p.n, a: p.a, v: p.v, q, c: f.get('c').trim(), tel: kyc ? f.get('tel').trim() : '', ac, plan: fac && ac < t ? { t: p.t, iv: p.iv } : null, pays: ac > 0 ? [{ d: ago(0), m: ac }] : [], etu, cph: kyc ? tmpC : '', sig: kyc ? $('sig').toDataURL('image/png') : '', rec: kyc, wa: kyc && f.get('wa') === '1', email: kyc ? (f.get('email') || '').trim() : '' };
        db.S.push(s); p.s -= q; save(); vVentes(); toast('Vente enregistrée'); invoice(s.id);
        if (env !== '0') { $(env === 'wa' ? 'sn' : 'se').value = dest; document.querySelector('[data-act="' + (env === 'wa' ? 'swa' : 'sem') + '"]').click() }
      }
    });
    loadSharedData().then(() => { go(); connectLive(); checkVersion(); setInterval(checkVersion, 300000) });
  </script>
</body>
