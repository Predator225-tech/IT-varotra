services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_shop}
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus} -d ${POSTGRES_DB:-campus_shop}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://campus:change-me@db:5432/campus_shop}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      UPLOAD_DIR: /data/uploads
      INVOICE_DIR: /data/invoices
    volumes:
      - uploads:/data/uploads
      - ./frontend/facture:/data/invoices
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
volumes:
  postgres_data:
  uploads:
